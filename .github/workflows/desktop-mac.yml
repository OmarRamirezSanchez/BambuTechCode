name: desktop-mac
run-name: "desktop-mac ${{ inputs.tag }}"

# Builds the governed BambuTechCode desktop app for macOS (Apple Silicon and Intel) from a release tag and attaches
# bambutechcode-mac-<arch>.dmg to that GitHub release. RAD's "Conectar mi IA" page links to the latest release.
#
# The fork has no Apple Developer ID, so the apps are signed ad hoc and not notarized: macOS asks the user to allow
# the app once in System Settings → Privacy & Security. The governed settings below are the same public values the
# Windows installer is built with: RAD prod and BambuIAFrameWork's only environment, which accepts RAD prod sessions.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to, for example v2.2.3"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'OmarRamirezSanchez/BambuTechCode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, cli: darwin-arm64, arch: arm64, install: --os=darwin --cpu=arm64 }
          # Packed on the Apple Silicon runner, as upstream does for its dev channel; afterPack checks the CPU.
          # The Intel desktop bundles the baseline CLI (packages/desktop/script/utils.ts CLI_BINARIES).
          - { target: darwin-x64, cli: darwin-x64-baseline, arch: x64, install: --os=darwin --cpu=* }
    runs-on: macos-26
    permissions:
      contents: write # attaches the dmg to the release
    env:
      OPENCODE_CHANNEL: latest
      RAD_WEB_ORIGIN: https://rad.bambu-mobile.com
      RAD_API_URL: https://44.241.70.4/api
      RAD_USAGE_API: https://44.241.70.4/api/projects/usage
      BAMBU_IA_ORIGIN: https://ia-dev.rad.bambu-mobile.com
      # RAD's public Firebase web config (project bambumobilerad), as in RAD_Frontend's environments.
      RAD_FIREBASE_CONFIG: '{"apiKey":"AIzaSyBfFogr9okQ6jGl2BuOhBT31Di8DIN1RcM","authDomain":"bambumobilerad.firebaseapp.com","projectId":"bambumobilerad"}'
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Version
        run: echo "OPENCODE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.install }}

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build
        env:
          OPENCODE_TARGET: ${{ matrix.cli }}

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_TARGET: ${{ matrix.target }}
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Pack
        working-directory: packages/desktop
        timeout-minutes: 60
        run: bun run pack
        env:
          OPENCODE_TARGET: ${{ matrix.target }}

      # Packing changes the Electron bundle, so its original signature no longer seals it and Apple Silicon refuses
      # to start it. An ad hoc signature seals it again without a Developer ID.
      - name: Sign ad hoc and build the dmg
        run: |
          work="$RUNNER_TEMP/mac"
          mkdir -p "$work/staging"
          tar -xf "dist/desktop/bambutechcode-mac-${{ matrix.arch }}.app.tar" -C "$work/staging"
          app=$(find "$work/staging" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ln -s /Applications "$work/staging/Applications"
          hdiutil create -volname "BambuTechCode" -srcfolder "$work/staging" -fs HFS+ -format UDZO -ov \
            "$work/bambutechcode-mac-${{ matrix.arch }}.dmg"
          echo "DMG=$work/bambutechcode-mac-${{ matrix.arch }}.dmg" >> "$GITHUB_ENV"

      - name: Attach to the release
        run: gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
